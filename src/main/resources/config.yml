    - "HEAVY_CORE"                    # 沉重核心
    - "GOLDEN_APPLE"                  # 金苹果
    - "GOLDEN_CARROT"                 # 金胡萝卜
    - "NETHERITE_SCRAP"               # 下界合金碎片
    - "GHAST_TEAR"                    # 恶魂之泪
    - "EXPERIENCE_BOTTLE"             # 附魔之瓶
    - "TRIAL_KEY"                     # 试炼钥匙
    - "OMINOUS_BOTTLE"                # 不祥之瓶
    - "OMINOUS_TRIAL_KEY"             # 不详试炼钥匙
    - "CAKE"                          # 蛋糕
    - "ENCHANTED_BOOK"                # 附魔书
    - "GOLD_INGOT"                    # 金锭
    - "IRON_INGOT"                    # 铁锭
    - "DIAMOND"                       # 钻石
    - "EMERALD"                       # 绿宝石
    - "NETHERITE_INGOT"               # 下界合金锭
